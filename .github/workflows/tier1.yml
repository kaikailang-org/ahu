name: tier1

# Install the current kaikai release with the official installer and run
# ahu's tier1 fixtures against it. Nothing is pinned: every run takes
# whatever release is current, so a compiler change that breaks ahu
# surfaces as a failed run here rather than as a stale pin passing
# against a compiler nobody uses any more.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tier1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ahu
        uses: actions/checkout@v4

      - name: Install kaikai (official installer)
        env:
          # The installer resolves the release through the GitHub API,
          # which allows 60 requests an hour unauthenticated.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/kaikailang-org/kaikai/main/install.sh | sh
          echo "$HOME/.kaikai/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          kai --version
          cc --version | head -1
          make --version | head -1

      - name: ahu tier0 (compile module + fixtures)
        run: make tier0

      - name: ahu tier1 (run fixtures + diff outputs)
        run: make tier1
